<div class="cards-container">
    <div class="row" *ngFor="let row of comercios">
       
        <mat-card class="example-card" appearance="outlined">
            <mat-card-header>
                <div mat-card-avatar class="example-header-image"
                    [style.backgroundImage]="'url(https://robohash.org/' + row.idComercio + ')'"></div>

                <mat-card-title>{{ row.nomComercio }}</mat-card-title>
               
            </mat-card-header>
            <img src="https://robohash.org/1" alt="Imagen del comercio" />
            <mat-card-content>
               
            </mat-card-content>
            <mat-card-actions>
                <button mat-button>Ver</button>
                <button mat-button>Más info</button>
            </mat-card-actions>
        </mat-card>
    </div>
   
</div>
