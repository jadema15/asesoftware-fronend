<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Iniciar sesión</h3>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" class="w-100 mb-3">
        <mat-label>Usuario</mat-label>
        <input matInput placeholder="Ingrese su usuario" formControlName="username" required>
      </mat-form-field>

      <mat-form-field appearance="fill" class="w-100 mb-3">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" placeholder="Ingrese su contraseña" formControlName="password" required>
      </mat-form-field>

      <button mat-raised-button color="primary" class="w-100" type="submit" [disabled]="loginForm.invalid">
        Iniciar sesión
      </button>
    </form>
  </div>
</div>
