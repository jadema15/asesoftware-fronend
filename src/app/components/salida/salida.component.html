<div class="container mt-4">
    <app-menu></app-menu>
    <div class="container mt-2">
        <h1 style="text-align: center;">Registro de Salida Asamblea</h1>
    </div>
    <form [formGroup]="filtrosForm" (ngSubmit)="onGenerar()">

        <!-- Primera fila: Select Comercio y Select Servicio -->

         <app-barcode-scanner (scanned)="onCodeScanned($event)"></app-barcode-scanner>
        
        <div class="row mb-3">
            <div class="col-md-12">
                <mat-form-field appearance="fill" class="w-100">
                    <mat-label>Documento de Identidad</mat-label>
                    <input matInput placeholder="Ingrese su numero de documento" formControlName="documento">
                </mat-form-field>
            </div>
        </div>

        <!-- Botón Salida -->
        <div style="display: flex; justify-content: center; gap: 16px; margin-top: 20px;">
            <button mat-raised-button color="warn" type="submit">Salida</button>
        </div>
    </form>
</div>
