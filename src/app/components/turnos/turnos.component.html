<div class="container mt-4">
    <app-menu></app-menu>

    <div class="container mt-2">
        <h1 style="text-align: center;">{{titulo}}</h1>
    </div>
    <form [formGroup]="filtrosForm" (ngSubmit)="onGenerar()">

        <app-barcode-scanner (scanned)="onCodeScanned($event)"></app-barcode-scanner>

        <!-- Primera fila: Select Comercio y Select Servicio -->
        <div class="row mb-3">
            <div class="col-md-12">
                <mat-form-field appearance="fill" class="w-100">
                    <mat-label>Documento de Identidad</mat-label>
                    <input matInput type="number" placeholder="Ingrese su numero de documento" formControlName="documento">
                </mat-form-field>
            </div>
        </div>

        <!-- Botón Generar -->
        <div style="display: flex; justify-content: center; gap: 16px; margin-top: 20px;">
            <button mat-raised-button color="primary" type="submit">Registrar</button>
        </div>

    </form>
    <div *ngIf="hasDetalle">
        <div class="bienvenida">
            <span class="titulo">Bienvenid@:</span>
            <span class="nombre">{{nombrePropietario}}</span>
        </div>
        <div class="mt-5"></div>

        <div *ngFor="let p of propiedades; let i = index; let first = first; let last = last">
            <mat-card class="card-horizontal">
                <div class="card-content">
                    <div><strong>N°:</strong> {{i + 1}}</div>
                    <div><strong>Propiedad:</strong> {{ p.propiedad }}</div>
                    <div><strong>Coeficiente:</strong> {{ p.coeficiente | number: '1.6-6' }}</div>
                </div>
            </mat-card>
        </div>
        <div>
            <mat-card class="card-horizontal">
                <div class="card-content">
                    <div><strong>Total coeficiente:</strong> {{ totalCoeficiente | number: '1.6-6' }}</div>
                </div>
            </mat-card>
        </div>
        <div class="asistencia-container mt-5">
            <mat-card class="asistencia-card">
                <div class="asistencia-text">
                    <div><strong>{{ asistencia | number: '1.2-2' }} %</strong></div>
                </div>
            </mat-card>
        </div>
    </div>
</div>
